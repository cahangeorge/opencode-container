[supervisord]
nodaemon=true
user=opencode
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:opencode-serve]
command=/usr/local/bin/opencode serve --hostname 0.0.0.0 --port 4096
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/opencode-serve.log
stderr_logfile=/var/log/supervisor/opencode-serve-error.log
environment=HOME="/home/opencode"

[program:openchamber]
command=/usr/local/bin/openchamber --foreground
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/openchamber.log
stderr_logfile=/var/log/supervisor/openchamber-error.log
environment=HOME="/home/opencode",OPENCODE_HOST="http://localhost:4096",OPENCODE_SKIP_START="true",OPENCHAMBER_HOST="0.0.0.0"
